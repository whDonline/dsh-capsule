<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-labelledby="title desc">
<title id="title">会话内授权体验</title><desc id="desc">输入框 chip 与第三个会话 tab；授权、免打扰、宿主档位分别展示。结构示意。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#147d68" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="722" rx="22" fill="#f6f9fa" stroke="#d2dfe3"/><text x="40" y="43" font-size="15" fill="#147d68" font-weight="700">01 / SESSION EXPERIENCE</text><text x="40" y="84" font-size="30" fill="#172c36" font-weight="700">授权状态，就在当前会话。</text><text x="40" y="116" font-size="18" fill="#536b76" font-weight="400">结构示意，非产品截图；用于说明入口与状态关系。</text><rect x="40" y="151" width="720" height="497" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="64" y="190" font-size="23" fill="#172c36" font-weight="600">当前会话</text><path d="M40 214H760" fill="none" stroke="#d2dfe3" stroke-width="2.5"/><text x="64" y="249" font-size="20" fill="#536b76" font-weight="400">对话          轨迹</text><rect x="391" y="223" width="340" height="43" rx="9" fill="#e6f5ef" stroke="#e6f5ef"/><text x="414" y="251" font-size="20" fill="#147d68" font-weight="600">能力授权</text><text x="64" y="306" font-size="15" fill="#147d68" font-weight="700">三种独立状态</text><rect x="63" y="326" width="674" height="51" rx="9" fill="#f6f9fa" stroke="#d2dfe3"/><text x="80" y="358" font-size="19" fill="#172c36" font-weight="600">短期授权</text><text x="273" y="358" font-size="18" fill="#536b76" font-weight="400">范围 / 剩余时间 / 撤销</text><rect x="63" y="389" width="674" height="51" rx="9" fill="#f6f9fa" stroke="#d2dfe3"/><text x="80" y="421" font-size="19" fill="#172c36" font-weight="600">免打扰窗口</text><text x="273" y="421" font-size="18" fill="#536b76" font-weight="400">倒计时 / 结束 / 延长</text><rect x="63" y="452" width="674" height="51" rx="9" fill="#f6f9fa" stroke="#d2dfe3"/><text x="80" y="484" font-size="19" fill="#172c36" font-weight="600">宿主沙箱档位</text><text x="273" y="484" font-size="18" fill="#536b76" font-weight="400">只读读数 / 不可用时 unknown</text><text x="64" y="553" font-size="20" fill="#536b76" font-weight="400">授权决策记录 + 时长设置</text><rect x="63" y="581" width="674" height="46" rx="9" fill="#172c36" stroke="#172c36"/><text x="80" y="611" font-size="18" fill="#ffffff" font-weight="400">输入框 chip：短期授权 / 免打扰倒计时 / 快捷操作</text><rect x="792" y="151" width="368" height="145" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="814" y="189" font-size="22" fill="#172c36" font-weight="600">会话作用域</text><text x="814" y="223" font-size="19" fill="#536b76" font-weight="400">直接使用宿主 sessionId</text><text x="814" y="253" font-size="19" fill="#536b76" font-weight="400">不以最近活动推断当前会话</text><rect x="792" y="319" width="368" height="145" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="814" y="357" font-size="22" fill="#172c36" font-weight="600">完全访问档位</text><text x="814" y="391" font-size="19" fill="#536b76" font-weight="400">隐藏 chip，无需授权</text><text x="814" y="421" font-size="19" fill="#536b76" font-weight="400">切回其他档位恢复入口与设置</text><rect x="792" y="487" width="368" height="161" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="814" y="525" font-size="22" fill="#172c36" font-weight="600">面向人的决策记录</text><text x="814" y="559" font-size="19" fill="#536b76" font-weight="400">批准了什么？</text><text x="814" y="589" font-size="19" fill="#536b76" font-weight="400">复用了几次？</text><text x="814" y="619" font-size="19" fill="#536b76" font-weight="400">如何结束？</text><text x="40" y="691" font-size="20" fill="#147d68" font-weight="600">免打扰是显式动作开启的窗口，不是持久化模式设置。</text></g></svg>
