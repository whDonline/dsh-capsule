<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Lease and DND lifecycle</title><desc id="desc">Human approval issues Leases. DND auto-approves eligible escalations without issuing Leases. Neither writes sandbox mode.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#147d68" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="748" rx="22" fill="#f6f9fa" stroke="#d2dfe3"/><text x="40" y="43" font-size="15" fill="#147d68" font-weight="700">02 / LIFECYCLE</text><text x="40" y="84" font-size="30" fill="#172c36" font-weight="700">Two lifecycles. Separate state.</text><text x="40" y="116" font-size="18" fill="#536b76" font-weight="400">Revocation and window expiry affect future approvals, not running calls.</text><text x="40" y="164" font-size="17" fill="#147d68" font-weight="700">A / SHORT-LIVED AUTHORIZATION</text><rect x="40" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="226" font-size="22" fill="#172c36" font-weight="600">Human approval</text><text x="62" y="260" font-size="19" fill="#536b76" font-weight="400">allowed-once</text><path d="M296 244H319" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="350" y="226" font-size="22" fill="#172c36" font-weight="600">Issue Lease</text><text x="350" y="260" font-size="19" fill="#536b76" font-weight="400">Scope + TTL</text><path d="M584 244H607" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="616" y="188" width="256" height="112" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="638" y="226" font-size="22" fill="#172c36" font-weight="600">Reuse</text><text x="638" y="260" font-size="19" fill="#536b76" font-weight="400">Valid matching grant</text><path d="M872 244H895" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="904" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="926" y="226" font-size="22" fill="#172c36" font-weight="600">End</text><text x="926" y="260" font-size="19" fill="#536b76" font-weight="400">Expiry / revocation</text><text x="40" y="336" font-size="19" fill="#536b76" font-weight="400">Miss, expired or revoked → delegate to native approval.</text><path d="M40 365H1160" fill="none" stroke="#d2dfe3" stroke-width="2.5"/><text x="40" y="410" font-size="17" fill="#9a691c" font-weight="700">B / DO-NOT-DISTURB WINDOW</text><rect x="40" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="472" font-size="22" fill="#172c36" font-weight="600">Explicitly open</text><text x="62" y="506" font-size="19" fill="#536b76" font-weight="400">User chooses duration</text><path d="M296 490H319" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="350" y="472" font-size="22" fill="#172c36" font-weight="600">Window active</text><text x="350" y="506" font-size="19" fill="#536b76" font-weight="400">Recorded escalations</text><path d="M584 490H607" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="616" y="434" width="256" height="112" rx="16" fill="#fbf2df" stroke="#d2dfe3"/><text x="638" y="472" font-size="22" fill="#172c36" font-weight="600">Auto-approve</text><text x="638" y="506" font-size="19" fill="#536b76" font-weight="400">allowed-once; no Lease</text><path d="M872 490H895" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="904" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="926" y="472" font-size="22" fill="#172c36" font-weight="600">Window ends</text><text x="926" y="506" font-size="19" fill="#536b76" font-weight="400">Native approval resumes</text><text x="40" y="583" font-size="19" fill="#536b76" font-weight="400">Ends on expiry, stop, detected native mode change or plugin disposal.</text><text x="40" y="612" font-size="19" fill="#536b76" font-weight="400">Extensions are bounded by the maximum total window duration.</text><rect x="40" y="650" width="1120" height="66" rx="16" fill="#172c36" stroke="#172c36"/><text x="64" y="691" font-size="20" fill="#93d8c5" font-weight="600">HOST SANDBOX MODE</text><text x="390" y="691" font-size="20" fill="#ffffff" font-weight="400">Read-only in both flows. Controlled by you and DSH.</text></g></svg>
