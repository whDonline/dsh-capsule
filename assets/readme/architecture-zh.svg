<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="title desc">
<title id="title">Guard 架构</title><desc id="desc">四个 hook 接入原生管线，连接 Lease、免打扰、审计与会话内界面。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#147d68" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="804" rx="22" fill="#f6f9fa" stroke="#d2dfe3"/><text x="40" y="43" font-size="15" fill="#147d68" font-weight="700">03 / ARCHITECTURE</text><text x="40" y="84" font-size="30" fill="#172c36" font-weight="700">四个 hook，一层审批增强。</text><text x="40" y="116" font-size="18" fill="#536b76" font-weight="400">DSH 负责执行与隔离；Guard 负责授权复用、窗口与可追溯性。</text><rect x="40" y="150" width="1120" height="70" rx="16" fill="#172c36" stroke="#172c36"/><text x="64" y="193" font-size="24" fill="#ffffff" font-weight="600">DeepSeek Harness</text><text x="360" y="192" font-size="21" fill="#bed3da" font-weight="400">Tool Pipeline  /  Approval  /  Sandbox  /  Credentials</text><path d="M171 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="302" font-size="22" fill="#172c36" font-weight="600">pre-execute</text><text x="62" y="336" font-size="19" fill="#536b76" font-weight="400">观察下游决策</text><text x="62" y="366" font-size="19" fill="#536b76" font-weight="400">保留 allow / deny</text><path d="M457 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="326" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="348" y="302" font-size="22" fill="#172c36" font-weight="600">execute</text><text x="348" y="336" font-size="19" fill="#536b76" font-weight="400">工具体前捕获参数</text><text x="348" y="366" font-size="19" fill="#536b76" font-weight="400">按 callId 关联操作</text><path d="M743 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="612" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="634" y="302" font-size="22" fill="#172c36" font-weight="600">approval/request</text><text x="634" y="336" font-size="19" fill="#536b76" font-weight="400">委派审批或复用</text><text x="634" y="366" font-size="19" fill="#536b76" font-weight="400">人工批准后签发</text><path d="M1029 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="898" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="920" y="302" font-size="22" fill="#172c36" font-weight="600">result</text><text x="920" y="336" font-size="19" fill="#536b76" font-weight="400">清理待处理上下文</text><text x="920" y="366" font-size="19" fill="#536b76" font-weight="400">记录执行结果</text><text x="42" y="437" font-size="15" fill="#147d68" font-weight="700">GUARD 内部服务</text><rect x="40" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="62" y="494" font-size="22" fill="#172c36" font-weight="600">LeaseManager</text><text x="62" y="528" font-size="19" fill="#536b76" font-weight="400">Scope、TTL 与撤销</text><text x="62" y="558" font-size="19" fill="#536b76" font-weight="400">操作族复用</text><rect x="422" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="444" y="494" font-size="22" fill="#172c36" font-weight="600">DndManager</text><text x="444" y="528" font-size="19" fill="#536b76" font-weight="400">用户显式开启的限时窗口</text><text x="444" y="558" font-size="19" fill="#536b76" font-weight="400">状态独立于 Lease</text><rect x="804" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="826" y="494" font-size="22" fill="#172c36" font-weight="600">Audit + Journal</text><text x="826" y="528" font-size="19" fill="#536b76" font-weight="400">面向人的授权决策记录</text><text x="826" y="558" font-size="19" fill="#536b76" font-weight="400">本机 NDJSON 追加日志</text><path d="M600 398V420" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M218 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M600 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M982 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M218 621H982" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M600 621V650" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="660" width="1120" height="74" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="64" y="705" font-size="24" fill="#172c36" font-weight="600">会话内界面</text><text x="300" y="704" font-size="21" fill="#536b76" font-weight="400">输入框模式 chip  /  能力授权 tab  /  本地排障接口</text><text x="40" y="774" font-size="19" fill="#147d68" font-weight="600">宿主沙箱档位只读；Guard 不写沙箱档位或审批策略。</text></g></svg>
