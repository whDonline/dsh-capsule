<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="title desc">
<title id="title">Guard architecture</title><desc id="desc">Four hooks connect DSH to Lease, DND and audit services and the session UI.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#147d68" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="804" rx="22" fill="#f6f9fa" stroke="#d2dfe3"/><text x="40" y="43" font-size="15" fill="#147d68" font-weight="700">03 / ARCHITECTURE</text><text x="40" y="84" font-size="30" fill="#172c36" font-weight="700">Four hooks. One approval layer.</text><text x="40" y="116" font-size="18" fill="#536b76" font-weight="400">DSH owns execution and isolation; Guard manages reuse and visibility.</text><rect x="40" y="150" width="1120" height="70" rx="16" fill="#172c36" stroke="#172c36"/><text x="64" y="193" font-size="24" fill="#ffffff" font-weight="600">DeepSeek Harness</text><text x="360" y="192" font-size="21" fill="#bed3da" font-weight="400">Tool Pipeline  /  Approval  /  Sandbox  /  Credentials</text><path d="M171 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="302" font-size="22" fill="#172c36" font-weight="600">pre-execute</text><text x="62" y="336" font-size="19" fill="#536b76" font-weight="400">Observe downstream</text><text x="62" y="366" font-size="19" fill="#536b76" font-weight="400">Preserve allow / deny</text><path d="M457 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="326" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="348" y="302" font-size="22" fill="#172c36" font-weight="600">execute</text><text x="348" y="336" font-size="19" fill="#536b76" font-weight="400">Capture arguments</text><text x="348" y="366" font-size="19" fill="#536b76" font-weight="400">Record by callId</text><path d="M743 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="612" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="634" y="302" font-size="22" fill="#172c36" font-weight="600">approval/request</text><text x="634" y="336" font-size="19" fill="#536b76" font-weight="400">Delegate or reuse</text><text x="634" y="366" font-size="19" fill="#536b76" font-weight="400">Issue after approval</text><path d="M1029 220V254" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="898" y="264" width="262" height="134" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="920" y="302" font-size="22" fill="#172c36" font-weight="600">result</text><text x="920" y="336" font-size="19" fill="#536b76" font-weight="400">Clear pending state</text><text x="920" y="366" font-size="19" fill="#536b76" font-weight="400">Record tool outcome</text><text x="42" y="437" font-size="15" fill="#147d68" font-weight="700">GUARD SERVICES</text><rect x="40" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="62" y="494" font-size="22" fill="#172c36" font-weight="600">LeaseManager</text><text x="62" y="528" font-size="19" fill="#536b76" font-weight="400">Scope + TTL + revocation</text><text x="62" y="558" font-size="19" fill="#536b76" font-weight="400">Operation-family reuse</text><rect x="422" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="444" y="494" font-size="22" fill="#172c36" font-weight="600">DndManager</text><text x="444" y="528" font-size="19" fill="#536b76" font-weight="400">Explicit, bounded windows</text><text x="444" y="558" font-size="19" fill="#536b76" font-weight="400">Independent of Leases</text><rect x="804" y="456" width="356" height="132" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="826" y="494" font-size="22" fill="#172c36" font-weight="600">Audit + Journal</text><text x="826" y="528" font-size="19" fill="#536b76" font-weight="400">Decision records</text><text x="826" y="558" font-size="19" fill="#536b76" font-weight="400">Local NDJSON persistence</text><path d="M600 398V420" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M218 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M600 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M982 588V621" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M218 621H982" fill="none" stroke="#147d68" stroke-width="2.5"/><path d="M600 621V650" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="660" width="1120" height="74" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="64" y="705" font-size="24" fill="#172c36" font-weight="600">In-session UI</text><text x="300" y="704" font-size="21" fill="#536b76" font-weight="400">Input chip  /  Authorization tab  /  Local diagnostic API</text><text x="40" y="774" font-size="19" fill="#147d68" font-weight="600">Read-only host sandbox mode. No sandbox or approval-policy writes.</text></g></svg>
