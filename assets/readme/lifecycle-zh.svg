<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">短期授权与免打扰生命周期</title><desc id="desc">人工批准签发 Lease；免打扰仅自动批准符合条件的升级；两者都不写沙箱档位。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#147d68" stroke-width="1.5"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="748" rx="22" fill="#f6f9fa" stroke="#d2dfe3"/><text x="40" y="43" font-size="15" fill="#147d68" font-weight="700">02 / LIFECYCLE</text><text x="40" y="84" font-size="30" fill="#172c36" font-weight="700">两条生命周期，状态彼此独立。</text><text x="40" y="116" font-size="18" fill="#536b76" font-weight="400">撤销与窗口结束影响后续审批，不中断已开始的调用。</text><text x="40" y="164" font-size="17" fill="#147d68" font-weight="700">A / 短期授权</text><rect x="40" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="226" font-size="22" fill="#172c36" font-weight="600">人工批准</text><text x="62" y="260" font-size="19" fill="#536b76" font-weight="400">allowed-once</text><path d="M296 244H319" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="350" y="226" font-size="22" fill="#172c36" font-weight="600">签发 Lease</text><text x="350" y="260" font-size="19" fill="#536b76" font-weight="400">明确 Scope + TTL</text><path d="M584 244H607" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="616" y="188" width="256" height="112" rx="16" fill="#e6f5ef" stroke="#d2dfe3"/><text x="638" y="226" font-size="22" fill="#172c36" font-weight="600">复用授权</text><text x="638" y="260" font-size="19" fill="#536b76" font-weight="400">匹配且仍有效</text><path d="M872 244H895" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="904" y="188" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="926" y="226" font-size="22" fill="#172c36" font-weight="600">授权结束</text><text x="926" y="260" font-size="19" fill="#536b76" font-weight="400">到期 / 主动撤销</text><text x="40" y="336" font-size="19" fill="#536b76" font-weight="400">未命中、到期或被撤销 → 交回原生审批。</text><path d="M40 365H1160" fill="none" stroke="#d2dfe3" stroke-width="2.5"/><text x="40" y="410" font-size="17" fill="#9a691c" font-weight="700">B / 免打扰窗口</text><rect x="40" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="62" y="472" font-size="22" fill="#172c36" font-weight="600">显式开启</text><text x="62" y="506" font-size="19" fill="#536b76" font-weight="400">由用户选择时长</text><path d="M296 490H319" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="350" y="472" font-size="22" fill="#172c36" font-weight="600">窗口生效</text><text x="350" y="506" font-size="19" fill="#536b76" font-weight="400">仅已记录的沙箱升级</text><path d="M584 490H607" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="616" y="434" width="256" height="112" rx="16" fill="#fbf2df" stroke="#d2dfe3"/><text x="638" y="472" font-size="22" fill="#172c36" font-weight="600">自动批准</text><text x="638" y="506" font-size="19" fill="#536b76" font-weight="400">allowed-once，不签 Lease</text><path d="M872 490H895" fill="none" stroke="#147d68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="904" y="434" width="256" height="112" rx="16" fill="#ffffff" stroke="#d2dfe3"/><text x="926" y="472" font-size="22" fill="#172c36" font-weight="600">窗口结束</text><text x="926" y="506" font-size="19" fill="#536b76" font-weight="400">恢复原生审批</text><text x="40" y="583" font-size="19" fill="#536b76" font-weight="400">到期、手动结束、检测到原生档位变化或卸载插件，窗口失效。</text><text x="40" y="612" font-size="19" fill="#536b76" font-weight="400">可以延长，但总时长不能超过上限。</text><rect x="40" y="650" width="1120" height="66" rx="16" fill="#172c36" stroke="#172c36"/><text x="64" y="691" font-size="20" fill="#93d8c5" font-weight="600">宿主沙箱档位</text><text x="390" y="691" font-size="20" fill="#ffffff" font-weight="400">两条链路都只读；始终由你与 DSH 决定。</text></g></svg>
